packages:
  - "packages/*"
  - "site"

# pnpm 11 reads only auth/registry settings from .npmrc; every other setting must
# live here in camelCase (was .npmrc under pnpm 9/10).
#   nodeOptions: Jest ESM support (--experimental-vm-modules). Stryker configs
#     duplicate this via testRunnerNodeArgs because Stryker spawns child processes
#     that don't inherit this setting.
#   link/preferWorkspacePackages: link local workspace packages instead of the
#     registry. npm auto-linked "*" deps; pnpm only links them with these enabled.
#   autoInstallPeers: keep peers resolving like npm 7+ (also pnpm's default).
nodeOptions: --experimental-vm-modules
linkWorkspacePackages: true
preferWorkspacePackages: true
autoInstallPeers: true

# Dependency build scripts allowed to run. pnpm 10+ blocks dependency install/build
# scripts by default; pnpm 11 makes an unreviewed build a hard failure
# (strictDepBuilds: true). `allowBuilds` is pnpm 11's replacement for the removed
# `onlyBuiltDependencies` — a map of package -> boolean. These three need theirs
# (native binaries / platform downloads); everything else stays blocked:
#   esbuild       — downloads its platform binary (required by astro/vite/tsx)
#   sharp         — native image pipeline (astro image optimization)
#   unrs-resolver — native napi resolver (eslint import resolution)
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

# Security overrides for transitive deps. Every entry is proven-necessary: removing
# it either lets resolution pick a vulnerable version (OSV regression) or is
# impossible because the parent forbids the fix. Redundant/stale pins were audited
# out (2026-07-23) — a bare "the parent allows a fix" is NOT grounds for a pin; pnpm
# cannot bump a deep transitive via `pnpm update`, so a scoped/blanket override is
# its only lever, and each must be removed once the parent ships a release that
# carries the fix (test: delete it, install, `osv-scanner` shows no regression).
# override-policy.json carries the CVE/reason/review-date per entry and is enforced
# by scripts/__tests__/pnpm-workspace-config.test.mjs. See
# docs/internal/dependency-overrides.md. pnpm 11 reads overrides ONLY from this file.
#
# Category A — parent forbids the fixed version (out-of-range force):
#   js-yaml: merge-key quadratic DoS (GHSA-h67p-54hq-rp68, no patched 3.x; fixed
#     4.2.0). Parents (gray-matter, read-yaml-file, @istanbuljs/load-nyc-config) all
#     pin ^3.x. gray-matter/read-yaml-file are pnpm-patched to swap the removed
#     safeLoad/safeDump for load/dump (patchedDependencies below).
#   yaml: parser DoS (GHSA-48c2-rrv3-qjmp, patched 2.8.3) via yaml-language-server,
#     which hard-pins yaml 2.7.1.
# Category B — fix is in-range but pnpm resolves a vulnerable version without the pin:
#   qs (GHSA-q8mj-m7cp-5q26 → 6.15.2), hono (GHSA-w62v/hvrm/xgm2 → 4.12.27),
#   body-parser (GHSA-v422-hmwv-36x6 → 2.3.0), brace-expansion 5.x
#   (GHSA-3jxr-9vmj-r5cp → 5.0.7), npm-run-all2>shell-quote (GHSA-395f-4hp3-45gv →
#   1.9.0; scoped so cli/core keep their declared shell-quote ^1.10.0),
#   fast-uri (GHSA-4c8g / GHSA-v2hh → 3.1.4).
overrides:
  # Category A
  "yaml-language-server>yaml": "^2.8.3"
  "gray-matter>js-yaml": "^4.2.0"
  "read-yaml-file>js-yaml": "^4.2.0"
  "@istanbuljs/load-nyc-config>js-yaml": "^4.2.0"
  # Category B
  qs: "^6.15.2"
  hono: "^4.12.27"
  "express>body-parser": "^2.3.0"
  "brace-expansion@5": "^5.0.7"
  "npm-run-all2>shell-quote": "^1.9.0"
  fast-uri: "^3.1.4"

patchedDependencies:
  gray-matter@4.0.3: patches/gray-matter@4.0.3.patch
  read-yaml-file@1.1.0: patches/read-yaml-file@1.1.0.patch
