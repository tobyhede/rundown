packages:
  - "packages/*"
  - "site"

# pnpm 11 reads only auth/registry settings from .npmrc; every other setting must
# live here in camelCase (was .npmrc under pnpm 9/10).
#   nodeOptions: Jest ESM support (--experimental-vm-modules). Stryker configs
#     duplicate this via testRunnerNodeArgs because Stryker spawns child processes
#     that don't inherit this setting.
#   link/preferWorkspacePackages: link local workspace packages instead of the
#     registry. npm auto-linked "*" deps; pnpm only links them with these enabled.
#   autoInstallPeers: keep peers resolving like npm 7+ (also pnpm's default).
nodeOptions: --experimental-vm-modules
linkWorkspacePackages: true
preferWorkspacePackages: true
autoInstallPeers: true

# Dependency build scripts allowed to run. pnpm 10+ blocks dependency install/build
# scripts by default; pnpm 11 makes an unreviewed build a hard failure
# (strictDepBuilds: true). `allowBuilds` is pnpm 11's replacement for the removed
# `onlyBuiltDependencies` — a map of package -> boolean. These three need theirs
# (native binaries / platform downloads); everything else stays blocked:
#   esbuild       — downloads its platform binary (required by astro/vite/tsx)
#   sharp         — native image pipeline (astro image optimization)
#   unrs-resolver — native napi resolver (eslint import resolution)
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

# Security overrides for transitive deps. pnpm 11 reads overrides ONLY from this
# file. Every entry needs a dated, CVE-annotated justification in
# override-policy.json; scripts/__tests__/pnpm-workspace-config.test.mjs enforces
# the 1:1 mapping. See docs/internal/dependency-overrides.md.
#
# An override exists to reach a fix the parent's declared range will not reach on
# its own. "The parent merely allows a newer version" is NOT grounds for a pin —
# that is lockfile staleness, and the fix is to refresh the lockfile.
#
# Test a pin for removal with `pnpm run audit:overrides`, never by hand. Deleting
# a pin and running `pnpm install` proves nothing: pnpm does not downgrade an
# already-satisfying locked version, so a Category B pin always scans clean
# against an existing lockfile whether or not it is doing anything. The audit
# resolves from scratch with no lockfile and diffs against a control run.
#
# Category A — parent forbids the fixed version (out-of-range force):
#   js-yaml (GHSA-h67p-54hq-rp68 → 4.2.0, GHSA-5p4m-2wfm-xmqj → 4.3.1). Parents
#     gray-matter, read-yaml-file and @istanbuljs/load-nyc-config all declare
#     ^3.x. A patched 3.x exists (3.15.1) and is NOT a viable target: gray-matter
#     and read-yaml-file are pnpm-patched to swap the removed safeLoad/safeDump
#     for load/dump, and `load` is the SAFE schema only on 4.x — on 3.x it is the
#     full/unsafe loader, so a 3.x resolution would trade a DoS for arbitrary
#     type construction while OSV reports clean. All three carry
#     `scannerInvisible` in override-policy.json for that reason, and the audit
#     refuses to test them for removal. Keep them keyed per parent: a
#     version-scoped `js-yaml@4` selector does not intersect a ^3.x declaration,
#     so it silently drops all three back to 3.15.1 and un-patches them.
# Category B — fix is in-range but resolution picks a vulnerable version:
#   qs (GHSA-q8mj-m7cp-5q26 → 6.15.2). The only pin still load-bearing under a
#     from-scratch resolve, re-proven by the audit on 2026-08-07.
#
# Pruned 2026-08-07, after the lockfile refresh that made them inert — each
# verified individually with `pnpm run audit:overrides`, which resolves without
# the pin and finds no regression: yaml-language-server>yaml, hono,
# express>body-parser, postcss, npm-run-all2>shell-quote, fast-uri, ip-address,
# and the astro / @astrojs/internal-helpers / @changesets/parse js-yaml trio.
# Every one was genuinely load-bearing when added. Upstream caught up, and it was
# the stale lockfile — not the parents' ranges — holding the tree back.
#
# brace-expansion (removed 2026-08-07) is the cautionary tale. Its premise, "the
# only fixed release is on the 5.x line", was true when written and later false:
# upstream backported to 1.x/2.x and OSV was edited in place. The pin then forced
# two subtrees cross-major into v5's `engines: node 20 || >=22` for no benefit.
# When an advisory is re-flagged, re-read its fixed-version list BEFORE raising a
# floor — a backport retires the pin instead of raising it.
#
# js-yaml 5.2.1 flow-collection DoS (GHSA-pm4m-ph32-ghv5) is fixed at the root by
# bumping the direct dep to ^5.2.2 in cli/core/plugin — no override needed.
overrides:
  # Category A — scannerInvisible; read override-policy.json before touching.
  "gray-matter>js-yaml": "^4.3.1"
  "read-yaml-file>js-yaml": "^4.3.1"
  "@istanbuljs/load-nyc-config>js-yaml": "^4.3.1"
  # Category B
  qs: "^6.15.2"

patchedDependencies:
  gray-matter@4.0.3: patches/gray-matter@4.0.3.patch
  read-yaml-file@1.1.0: patches/read-yaml-file@1.1.0.patch
