# docker-compose.verify.yml — Rundown Docker verification services
# Usage:
#   docker compose -f docker-compose.verify.yml build test-local
#   docker compose -f docker-compose.verify.yml run --rm test-local
#
#   docker compose -f docker-compose.verify.yml build test-npm
#   docker compose -f docker-compose.verify.yml run --rm test-npm

services:
  test-local:
    build:
      context: .
      dockerfile: scripts/Dockerfile.verify
      target: local
    image: rundown-verify:local
    volumes:
      - ./.claude-docker:/home/testuser/.claude
      - ./logs:/home/testuser/logs
    environment:
      - RUNDOWN_LOG=1
      - RUNDOWN_LOG_LEVEL=debug
    stdin_open: true
    tty: true

  test-npm:
    build:
      context: .
      dockerfile: scripts/Dockerfile.verify
      target: npm
    image: rundown-verify:npm
    volumes:
      - ./.claude-docker:/home/testuser/.claude
      - ./logs:/home/testuser/logs
    environment:
      - RUNDOWN_LOG=1
      - RUNDOWN_LOG_LEVEL=debug
    stdin_open: true
    tty: true
