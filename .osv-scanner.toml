# OSV-Scanner ignore file — dated, justified risk acceptances only.
#
# Every entry MUST carry a reason and an ignoreUntil review date. An ignore is for
# a finding that cannot currently be fixed by the correct mechanism (a lockfile
# bump, a scoped override in pnpm-workspace.yaml, or a direct-dep update). When the
# ignoreUntil date passes, the scanner surfaces the finding again for re-review —
# do not extend a date without re-checking whether the fix has become available.
# See docs/internal/dependency-overrides.md.
#
# The list is currently EMPTY, which is the goal state. Nothing is being accepted.
# The file stays because the blocking OSV workflow passes --config=.osv-scanner.toml
# and errors if it is missing.
#
# Watch for `osv-scanner` printing ".osv-scanner.toml has unused ignores". An
# acceptance stops matching precisely when the fix becomes reachable, so that
# warning is the earliest notice that an entry below can be retired. It is what
# surfaced the one entry this file used to carry:
#
#   GHSA-frvp-7c67-39w9 — @hono/node-server serveStatic path traversal (CVSS 5.9),
#   accepted 2026-07-23 because the fix (2.0.5) was a MAJOR that
#   @modelcontextprotocol/sdk@1.29.0 forbade (it declared ^1.19.9), and serveStatic
#   was unreachable anyway. Retired 2026-08-07: SDK 1.30.0 declares
#   `^1.19.9 || ^2.0.5`, so a from-scratch lockfile resolve reaches 2.1.0 and the
#   finding is genuinely fixed rather than accepted. Note the SDK bump ALONE did not
#   do it — 1.19.14 still satisfies the widened range, so pnpm had no reason to move
#   it. That is the same silent no-op an override with a stale floor produces.
