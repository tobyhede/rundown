[package]
name = "rd-landlock"
version = "0.1.0"
edition = "2021"
publish = false
description = "First-party Landlock sandbox helper for Rundown"

[[bin]]
name = "rd-landlock"
path = "src/main.rs"

[dependencies]
landlock = "=0.4.1"
libc = "=0.2.169"
os_pipe = "=1.2.1"
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = "=1.0.138"

[dev-dependencies]
tempfile = "3"
proptest = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
