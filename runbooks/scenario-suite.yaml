version: 1
name: Pattern regression scenarios
description: Cross-directory regression suite for pattern runbooks
tags:
  - patterns
  - regression

cases:
  # transitions/
  default-implicit-completed:
    description: Both steps pass with implicit transitions
    file: transitions/default-implicit.runbook.md
    commands:
      - rd run --prompted default-implicit.runbook.md
      - rd pass
      - rd pass
    result: COMPLETE

  pass-stop-stopped:
    description: PASS STOP halts the runbook
    file: transitions/pass-stop.runbook.md
    commands:
      - rd run --prompted pass-stop.runbook.md
      - rd pass
    result: STOP

  fail-continue-completed:
    description: FAIL CONTINUE proceeds to next step
    file: transitions/fail-continue.runbook.md
    commands:
      - rd run --prompted fail-continue.runbook.md
      - rd fail
      - rd pass
    result: COMPLETE

  # retries/
  retry-success-after-retry:
    description: Fails first, succeeds on retry
    file: retries/retry-success.runbook.md
    commands:
      - rd run --prompted retry-success.runbook.md
      - rd fail
      - rd pass
    result: COMPLETE

  retry-exhaustion-stop:
    description: Exhaustion with STOP halts the runbook
    file: retries/retry-exhaustion-stop.runbook.md
    commands:
      - rd run --prompted retry-exhaustion-stop.runbook.md
      - rd fail
      - rd fail
    result: STOP

  # goto/
  goto-step-completed:
    description: Jump from step 1 to step 3
    file: goto/goto-step.runbook.md
    commands:
      - rd run --prompted goto-step.runbook.md
      - rd pass
      - rd pass
    result: COMPLETE

  goto-from-fail-recovered:
    description: Fail triggers GOTO to recovery
    file: goto/goto-from-fail.runbook.md
    commands:
      - rd run --prompted goto-from-fail.runbook.md
      - rd fail
      - rd pass
    result: COMPLETE

  # named-steps/
  named-step-basic-completed:
    description: Named step passes and completes
    file: named-steps/named-step-basic.runbook.md
    commands:
      - rd run --prompted named-step-basic.runbook.md
      - rd pass
    result: COMPLETE

  # substeps/
  mixed-substeps-happy-path:
    description: All substeps pass through
    file: substeps/mixed-substeps.runbook.md
    commands:
      - rd run --prompted mixed-substeps.runbook.md
      - rd pass
      - rd pass
      - rd pass
    result: COMPLETE

  # for-loops/
  for-range-to-completed:
    description: FOR loop iterates five times and completes
    file: for-loops/for-range-to.runbook.md
    commands:
      - rd run for-range-to.runbook.md
    result: COMPLETE

  # prompts/
  implicit-prompt-completed:
    description: Pass both implicit prompt steps
    file: prompts/implicit-prompt.runbook.md
    commands:
      - rd run --prompted implicit-prompt.runbook.md
      - rd pass
      - rd pass
    result: COMPLETE

  # delegation/
  delegate-basic-completed:
    description: Delegate substep to child, child auto-completes
    file: delegation/delegate-basic.runbook.md
    commands:
      - rd run delegate-basic.runbook.md
      - rd delegate delegation/delegation-child-pass.runbook.md --step 1.1
      - rd claim ${TOKEN}
    result: COMPLETE

  delegate-failure-child-fails:
    description: Child fails, failure propagates STOP to parent
    file: delegation/delegate-failure.runbook.md
    commands:
      - rd run delegate-failure.runbook.md
      - rd delegate delegation/delegation-child-fail.runbook.md --step 1.1
      - rd claim ${TOKEN}
    result: STOP

  delegate-abort-pending:
    description: Create delegation then abort before claim
    file: delegation/delegate-abort.runbook.md
    commands:
      - rd run --prompted delegate-abort.runbook.md
      - rd delegate delegation/delegation-child-pass.runbook.md --step 1.1
      - rd abort ${TOKEN}
      - rd pass
    result: COMPLETE

  # for-loops/ (new coverage)
  for-descending-completed:
    description: Descending range iterates 3, 2, 1
    file: for-loops/for-descending.runbook.md
    commands:
      - rd run for-descending.runbook.md
    result: COMPLETE

  for-next-action-fail-skips:
    description: FAIL NEXT skips the failed iteration and loop continues
    file: for-loops/for-next-action.runbook.md
    commands:
      - rd run for-next-action.runbook.md
    result: COMPLETE

  for-iteration-transitions-continue:
    description: FAIL CONTINUE per iteration allows loop to complete
    file: for-loops/for-iteration-transitions.runbook.md
    commands:
      - rd run for-iteration-transitions.runbook.md
    result: COMPLETE

  for-substep-break-respects-retry:
    description: Substep BREAK respects iteration-level retry (non-accumulating)
    file: for-loops/for-substep-break-respects-retry.runbook.md
    commands:
      - rd run --prompted for-substep-break-respects-retry.runbook.md
      - rd fail
      - rd fail
      # BREAK is non-accumulating → iterationResults=[] → vacuous pass → step 2
      - rd pass
    result: COMPLETE

  for-iteration-retry-after-retry:
    description: Each iteration fails once then passes on retry via iteration-level RETRY
    file: for-loops/for-iteration-retry.runbook.md
    commands:
      - rd run for-iteration-retry.runbook.md
    result: COMPLETE

  for-variable-bounds-completed:
    description: Template variable bounds expand at parse time
    file: for-loops/for-variable-bounds.runbook.md
    commands:
      - rd run --input Max=3 for-variable-bounds.runbook.md
    result: COMPLETE

  # goto/ (new coverage)
  goto-at-iteration-completed:
    description: GOTO AT jumps into FOR loop at iteration 3
    file: goto/goto-at-iteration.runbook.md
    commands:
      - rd run goto-at-iteration.runbook.md
    result: COMPLETE

  # variables/ (new coverage)
  context-current-completed:
    description: Context position variables echo from substep
    file: variables/context-current.runbook.md
    commands:
      - rd run context-current.runbook.md
    result: COMPLETE

  variable-precedence-override:
    description: CLI --input overrides frontmatter default
    file: variables/variable-precedence.runbook.md
    commands:
      - rd run --input greeting=overridden variable-precedence.runbook.md
    result: COMPLETE

  # transitions/ (new coverage)
  separator-syntax-completed:
    description: Each step uses a different separator and all pass
    file: transitions/separator-syntax.runbook.md
    commands:
      - rd run separator-syntax.runbook.md
    result: COMPLETE

  fail-all-standalone-completed:
    description: One substep passes so PASS ANY continues
    file: transitions/fail-all-standalone.runbook.md
    commands:
      - rd run --prompted fail-all-standalone.runbook.md
      - rd fail
      - rd pass
      - rd pass
    result: COMPLETE

  fail-all-standalone-stopped:
    description: All substeps fail and FAIL ALL stops
    file: transitions/fail-all-standalone.runbook.md
    commands:
      - rd run --prompted fail-all-standalone.runbook.md
      - rd fail
      - rd fail
    result: STOP

  all-modifier-one-fails-stopped:
    description: One substep fails, FAIL ANY fires STOP
    file: transitions/all-modifier.runbook.md
    commands:
      - rd run --prompted all-modifier.runbook.md
      - rd fail
      - rd pass
    result: STOP

  any-modifier-mixed-completed:
    description: First fails, second passes, PASS ANY fires COMPLETE
    file: transitions/any-modifier.runbook.md
    commands:
      - rd run --prompted any-modifier.runbook.md
      - rd fail
      - rd pass
    result: COMPLETE

  # named-steps/ (new coverage)
  named-step-for-loop-completed:
    description: Named step iterates normally with FOR loop
    file: named-steps/named-step-for-loop.runbook.md
    commands:
      - rd run named-step-for-loop.runbook.md
    result: COMPLETE

  # stash-pop/
  stash-pop-basic-resumed:
    description: Stash mid-execution, pop to resume, then complete
    file: stash-pop/stash-pop-basic.runbook.md
    commands:
      - rd run --prompted stash-pop-basic.runbook.md
      - rd pass
      - rd stash
      - rd pop
      - rd pass
    result: COMPLETE

  stash-pop-interleave-completed:
    description: Stash A, run B to completion, pop A and complete
    file: stash-pop/stash-pop-interleave.runbook.md
    commands:
      - rd run --prompted stash-pop-interleave.runbook.md
      - rd pass
      - rd stash
      - rd run stash-pop-interleave-child.runbook.md
      - rd pop
      - rd pass
    result: COMPLETE

  # delegation/ (cross-feature)
  delegate-named-step-completed:
    description: Named step delegates substep to child
    file: delegation/delegate-named-step.runbook.md
    commands:
      - rd run delegate-named-step.runbook.md
      - rd delegate delegation-child-pass.runbook.md --step Review.1
      - rd claim ${TOKEN}
    result: COMPLETE

  # composition/
  step-runbook-list-completed:
    description: All child workflows pass
    file: composition/step-runbook-list.runbook.md
    commands:
      - rd run --prompted step-runbook-list.runbook.md
      - rd pass
      - rd pass
      - rd pass
    result: COMPLETE
