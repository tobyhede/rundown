# Landlock-compatible policy for Rundown
#
# Rundown's built-in default policy uses subtractive file-access deny rules
# (e.g. read `{repo}/**` but deny `**/.env`). Linux Landlock is an allow-list
# mechanism: it cannot express "allow this tree EXCEPT these files". When the
# effective policy carries such deny-paths, the Linux sandbox backend fails
# closed and refuses to run rather than silently not enforcing the deny.
#
# This policy is the default policy with the file-path deny lists removed, so it
# runs under Landlock. The command (`run`) and environment (`env`) deny lists are
# KEPT — those are enforced by the policy evaluator, not the sandbox, so they
# still block dangerous commands and secret-bearing env vars.
#
# Trade-off: under Landlock, a permitted command can read/write secret-named
# files (`.env`, `*.pem`, …) that live inside the allowed `{repo}/**` or
# `{tmp}/**` trees. The env deny list still keeps tokens out of the environment,
# and the command deny list still blocks exfiltration tools (curl, scp, …).
# On macOS (Seatbelt) the default policy enforces the file denies natively, so
# prefer the default there. Use this policy when you want real Landlock
# enforcement on Linux and accept the in-tree trade-off above.
#
# Usage:
#   rundown run file.runbook.md --policy docs/examples/landlock.rundownrc.yaml
# or copy to your project root as `.rundownrc.yaml` for auto-discovery.

version: 1
default:
  mode: prompted

  run:
    allow:
      - git
      - node
      - npm
      - npx
      - pnpm
      - yarn
      - bun
      - tsc
      - esbuild
      - vite
      - webpack
      - rollup
      - eslint
      - prettier
      - biome
      - jest
      - vitest
      - mocha
      - playwright
      - cypress
      - python
      - python3
      - pip
      - pip3
      - go
      - cargo
      - rustc
      - make
      - cmake
      - rd
      - rundown
      - rdpath
      - rdx
    deny:
      - sudo
      - su
      - passwd
      - useradd
      - usermod
      - userdel
      - chown
      - chmod
      - curl
      - wget
      - nc
      - netcat
      - ncat
      - ssh
      - scp
      - sftp
      - rsync
      - rm
      - rmdir
      - mv
      - dd
      - mkfs
      - fdisk
      - parted
      - kill
      - killall
      - pkill
      - docker
      - podman
      - kubectl
      - helm

  # File access: allow-list only. No deny rules — Landlock cannot subtract paths
  # from a granted tree, so any deny here would force the backend to fail closed.
  read:
    allow:
      - '{repo}/**'
      - '{tmp}/**'
    deny: []

  write:
    allow:
      - '{repo}/.claude/**'
      - '{repo}/.rundown/runs/**'
      - '{repo}/.rundown/locks/**'
      - '{repo}/.rundown/contexts/**'
      - '{repo}/.rundown/session.json'
      - '{repo}/.rundown/work/**'
      - '{repo}/node_modules/**'
      - '{repo}/dist/**'
      - '{repo}/build/**'
      - '{repo}/.next/**'
      - '{tmp}/**'
    deny: []

  # Environment denies are enforced by the policy evaluator (not the sandbox),
  # so they are kept to keep tokens and credentials out of command environments.
  env:
    allow:
      - PATH
      - HOME
      - USER
      - SHELL
      - TERM
      - LANG
      - LC_*
      - TMPDIR
      - TMP
      - TEMP
      - CI
      - NODE_ENV
      - DEBUG
      - npm_*
      - RUNDOWN_*
    deny:
      - '*_TOKEN'
      - '*_KEY'
      - '*_SECRET'
      - '*_PASSWORD'
      - '*_CREDENTIAL'
      - 'AWS_*'
      - 'GCP_*'
      - 'AZURE_*'
      - 'GOOGLE_*'
      - KUBECONFIG
      - 'DOCKER_*'
      - 'SSH_*'
      - 'GPG_*'
      - GITHUB_TOKEN
      - GITLAB_TOKEN
      - NPM_TOKEN

overrides: []
grants: []
