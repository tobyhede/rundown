name: Mutation Testing

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to test'
        required: true
        type: choice
        options:
          - all
          - parser
          - core
          - cli
          - plugin
  schedule:
    - cron: '0 6 * * 1' # Weekly Monday 06:00 UTC

permissions:
  contents: read

jobs:
  # A full core/cli campaign cannot finish in a single 60-min CI job, so the
  # producer fans out across shards. This job decides the shard matrix for the
  # event: schedule/dispatch shard the full mutate scope; push shards only the
  # changed source (differential). Each shard mutates a DISJOINT file set, which
  # is what lets the merge job stitch the partial reports back into one
  # full-fidelity per-module report.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      empty: ${{ steps.plan.outputs.empty }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # Full history so the push differential can diff github.event.before.
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Plan shard matrix
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PACKAGE: ${{ github.event.inputs.package }}
          PUSH_BASE: ${{ github.event.before }}
          # Source-line budget per shard (a mutant-count proxy, measured at
          # 0.39-0.60 mutants per source line across the four packages).
          #
          # Calibrated from the 2026-08-03 campaign, where all 9 core shards at
          # MAX_SHARD_LINES=6000 were killed by the timeout with 12-27% of their
          # mutants tested. The SLOWEST shard there managed 5.6 mutants/min
          # (core's most widely imported modules pull most of the suite through
          # findRelatedTests); 800 lines is ~310 core mutants, ~56 min at that
          # worst-observed rate and ~25 min at the campaign median of 12.4/min.
          # A file above LARGE_SOURCE_FILE_LINES is split into line-range chunks
          # of half this budget and run at concurrency 2 (see
          # partitionProducerFiles), which is what makes a 4000-line module
          # measurable at all.
          MAX_SHARD_LINES: '800'
          # GitHub hard-fails a run whose matrix exceeds 256 jobs. The planner
          # widens the line budget (and says so) rather than dropping coverage
          # when the plan would cross this.
          MAX_SHARD_JOBS: '240'
        run: node scripts/mutation-shard-plan.mjs

  # One job per shard. A shard that exceeds its budget is mis-sized (shrink
  # MAX_SHARD_LINES), not legitimately slow. Shards never hold the dashboard key,
  # so they cannot upload a partial, scoped report that would corrupt the
  # baseline — only the merge job uploads.
  #
  # The two timeouts are deliberately UNEQUAL, and that is the fix for the
  # producer's oldest failure mode. They used to both be 60: the job clock starts
  # ~3 min before the Stryker step, so the JOB timeout always fired first and
  # CANCELLED the job. Stryker writes its JSON report only on completion, so the
  # shard then vanished from the merged report with no evidence of why, and
  # raising only the job cap would have changed nothing because the step cap fired
  # at the same wall-clock. With the step capped strictly below the job, the step
  # FAILS (absorbed by continue-on-error) while the job is still alive, and the
  # status and upload steps below run normally.
  mutate:
    needs: plan
    if: ${{ needs.plan.outputs.empty != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      # Size-aware, decided per shard by the planner: 4 for a shard of
      # ordinary-sized files, 2 for a shard mutating a file above
      # LARGE_SOURCE_FILE_LINES, whose instrumented module graph every worker
      # holds (a ~3600-line file measured 3-4 GB per worker). This mirrors the
      # local policy in scripts/mutate-changed.mjs off the SAME threshold
      # constant. An empty value falls back to the package default of 2.
      STRYKER_CONCURRENCY: ${{ matrix.concurrency }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Run mutation shard
        id: shard
        # A low score makes Stryker exit non-zero on thresholds.break; that floor
        # belongs on the merged aggregate, not a single shard, so a shard must
        # not fail the job on score alone. A crash or a step timeout produces no
        # report and is caught by the merge job's per-shard completeness check,
        # which reads the status recorded below. The report uploads regardless
        # via always().
        continue-on-error: true
        # Strictly below the job cap; see the mutate job comment above.
        timeout-minutes: 60
        working-directory: ${{ matrix.dir }}
        # The dashboard key is deliberately absent here: shards never upload.
        # ignoreStatic is left unset so static mutants are scored at full fidelity.
        # matrix.mutate is passed via env (not templated into the shell) so a
        # file path with shell metacharacters can't inject into the command.
        env:
          MUTATE: ${{ matrix.mutate }}
          SHARD_LOG: ${{ runner.temp }}/shard.log
        # `tee` under pipefail so the step still reports Stryker's exit status
        # while the log survives for the status step below. The log is the only
        # place a killed shard's measured progress can be recovered from.
        run: |
          set -o pipefail
          pnpm exec stryker run --mutate "$MUTATE" 2>&1 | tee "$SHARD_LOG"

      # Runs on EVERY exit path, including a cancelled job, so an unmeasured
      # shard is reported as such instead of silently missing from the merge.
      - name: Record shard status
        if: ${{ always() }}
        env:
          MODULE: ${{ matrix.module }}
          PACKAGE: ${{ matrix.package }}
          SHARD: ${{ matrix.shard }}
          SHARD_COUNT: ${{ matrix.shardCount }}
          CONCURRENCY: ${{ matrix.concurrency }}
          MUTATE: ${{ matrix.mutate }}
          OUTCOME: ${{ steps.shard.outcome }}
          SHARD_LOG: ${{ runner.temp }}/shard.log
          REPORT: ${{ matrix.dir }}/reports/mutation/mutation-report.json
          STATUS_FILE: ${{ runner.temp }}/shard-status.json
        run: node scripts/mutation-shard-status.mjs

      - name: Upload shard report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: mutation-report-${{ matrix.module }}-shard${{ matrix.shard }}
          path: ${{ matrix.dir }}/reports/mutation/mutation-report.json
          retention-days: 7
          if-no-files-found: warn

      # Deliberately NOT named `mutation-report-*`: the merge job globs that
      # pattern for reports, and a status matching it would be counted as one.
      - name: Upload shard status
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: mutation-status-${{ matrix.module }}-shard${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-status.json
          retention-days: 7
          if-no-files-found: warn

  # Stitch every shard's partial report into one full per-module report, apply
  # the aggregate break floor, and (only on the weekly schedule, on main) upload
  # the complete baseline to the dashboard. A push is differential, so its merge
  # is partial by construction and never uploads; a dispatch may run off a
  # feature branch and never uploads.
  merge:
    needs: [plan, mutate]
    if: ${{ always() && needs.plan.outputs.empty != 'true' }}
    runs-on: ubuntu-latest
    # Two artifacts per shard and a matrix now in the low hundreds, so the
    # download dominates this job rather than the merge itself.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Download shard reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: shard-reports
          pattern: mutation-report-*
      # A status exists for every shard, including the ones that produced no
      # report — that is what turns "absent" into a named, explained shard in the
      # job summary. Non-fatal: statuses are diagnostics, never the verdict.
      - name: Download shard statuses
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        continue-on-error: true
        with:
          path: shard-status
          pattern: mutation-status-*
      - name: Merge reports, enforce floor, upload baseline
        env:
          DOWNLOAD_DIR: shard-reports
          STATUS_DIR: shard-status
          MATRIX: ${{ needs.plan.outputs.matrix }}
          VERSION: main
          # Upload ONLY on the weekly schedule on main: that is the only run that
          # shards the FULL scope, so its merge is a complete report safe to
          # (re)seed the baseline. Gating the key (not just a flag) means a
          # dispatch/push physically cannot push to the dashboard.
          UPLOAD: ${{ (github.ref == 'refs/heads/main' && github.event_name == 'schedule') && 'true' || 'false' }}
          DASHBOARD_API_KEY: ${{ (github.ref == 'refs/heads/main' && github.event_name == 'schedule') && secrets.STRYKER_DASHBOARD_API_KEY || '' }}
          # Enforce the aggregate break floor on the producer run; advisory on
          # dispatch/push (report the score without failing).
          APPLY_BREAK: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
        run: node scripts/mutation-merge-reports.mjs
