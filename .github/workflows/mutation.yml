name: Mutation Testing

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to test'
        required: true
        type: choice
        options:
          - all
          - parser
          - core
          - cli
          - plugin
  schedule:
    - cron: '0 6 * * 1' # Weekly Monday 06:00 UTC

jobs:
  mutate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: parser
            dir: packages/parser
          - package: core
            dir: packages/core
          - package: cli
            dir: packages/cli
          - package: plugin
            dir: packages/claude-code-plugin
    if: >-
      github.event_name == 'schedule' ||
      github.event.inputs.package == 'all' ||
      github.event.inputs.package == '${{ matrix.package }}'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Restore Stryker incremental cache
        uses: actions/cache@v5
        with:
          path: ${{ matrix.dir }}/reports/stryker-incremental.json
          key: stryker-${{ matrix.package }}-${{ github.sha }}
          restore-keys: stryker-${{ matrix.package }}-

      - name: Run mutation tests
        run: npx stryker run
        working-directory: ${{ matrix.dir }}

      - name: Upload mutation report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mutation-report-${{ matrix.package }}
          path: |
            ${{ matrix.dir }}/reports/mutation/
          retention-days: 30
