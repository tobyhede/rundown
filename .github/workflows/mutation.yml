name: Mutation Testing

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to test'
        required: true
        type: choice
        options:
          - all
          - parser
          - core
          - cli
          - plugin
  schedule:
    - cron: '0 6 * * 1' # Weekly Monday 06:00 UTC

jobs:
  mutate-parser:
    if: >-
      github.event_name == 'schedule' ||
      github.event.inputs.package == 'all' ||
      github.event.inputs.package == 'parser'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Restore Stryker incremental cache
        uses: actions/cache@v4
        with:
          path: packages/parser/reports/stryker-incremental.json
          key: stryker-parser-${{ github.sha }}
          restore-keys: stryker-parser-

      - name: Run mutation tests
        run: npx stryker run
        working-directory: packages/parser

      - name: Upload mutation report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report-parser
          path: |
            packages/parser/reports/mutation/
          retention-days: 30

  mutate-core:
    if: >-
      github.event_name == 'schedule' ||
      github.event.inputs.package == 'all' ||
      github.event.inputs.package == 'core'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Restore Stryker incremental cache
        uses: actions/cache@v4
        with:
          path: packages/core/reports/stryker-incremental.json
          key: stryker-core-${{ github.sha }}
          restore-keys: stryker-core-

      - name: Run mutation tests
        run: npx stryker run
        working-directory: packages/core

      - name: Upload mutation report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report-core
          path: |
            packages/core/reports/mutation/
          retention-days: 30

  mutate-cli:
    if: >-
      github.event_name == 'schedule' ||
      github.event.inputs.package == 'all' ||
      github.event.inputs.package == 'cli'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Restore Stryker incremental cache
        uses: actions/cache@v4
        with:
          path: packages/cli/reports/stryker-incremental.json
          key: stryker-cli-${{ github.sha }}
          restore-keys: stryker-cli-

      - name: Run mutation tests
        run: npx stryker run
