name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # Read-only: builds all package dist outputs, builds the native binaries, and
  # runs tests with NO publish credentials in scope. The Rust/Zig toolchain
  # (supply-chain surface), package build scripts, and the test run are confined
  # here.
  build-native:
    name: Build native (read-only)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v6
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Packages
        run: pnpm run build

      - uses: ./.github/actions/setup-rust-zigbuild

      - name: Build native binaries + provenance manifest
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/build-native.mjs

      - name: Assert static ELF of the expected arch
        env:
          RD_ASSERT_NATIVE_RUN: '1'
        run: node scripts/assert-native.mjs

      - name: Run Tests
        run: pnpm test

      - name: Upload package dist artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: release-package-dist
          path: |
            packages/parser/dist/
            packages/core/dist/
            packages/cli/dist/
            packages/claude-code-plugin/dist/
            packages/mcp/dist/
          retention-days: 1

      - name: Upload rd-landlock binaries + manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: rd-landlock-binaries
          path: packages/core/dist/native/
          retention-days: 1

  # Read-only handoff: verify native provenance and place the native binaries
  # into the package dist tree before the credentialed publish job sees it.
  verify-release-artifacts:
    name: Verify release artifacts (read-only)
    needs: build-native
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v6
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install Dependencies (no lifecycle scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download package dist artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-package-dist
          path: packages

      - name: Download rd-landlock binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: rd-landlock-binaries
          path: rd-landlock-out

      - name: Verify provenance + place native binaries
        env:
          RD_RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/build-native.mjs --from-artifacts "$PWD/rd-landlock-out"
          RD_ASSERT_NATIVE_RUN=1 node scripts/assert-native.mjs

      - name: Upload verified package dist artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: verified-release-package-dist
          path: |
            packages/parser/dist/
            packages/core/dist/
            packages/cli/dist/
            packages/claude-code-plugin/dist/
            packages/mcp/dist/
          retention-days: 1

  # Credentialed publish: consumes verified artifacts. Does NOT run package
  # build scripts, repository verification scripts, the Rust toolchain, or tests.
  release:
    name: Release (publish)
    needs: verify-release-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      # persist-credentials:false — do NOT leave the write-scoped git token in
      # the on-disk git config. changesets authenticates via its own
      # GITHUB_TOKEN/NPM_TOKEN env below. fetch-depth:0 for version history.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v6
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      # --ignore-scripts: dependency postinstall lifecycle scripts must NOT run
      # while publish credentials (NPM_TOKEN / OIDC) are in scope. Package dist
      # outputs are restored from the read-only verified artifact below.
      - name: Install Dependencies (no lifecycle scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download verified package dist artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: verified-release-package-dist
          path: packages

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51  # v1
        with:
          title: 'chore: release packages'
          commit: 'chore: release packages'
          publish: pnpm release -- --provenance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # NOTE: the credentialed job intentionally installs with --ignore-scripts and
  # downloads a pre-verified dist/native artifact. The only repository-authored
  # command that receives publish credentials is changesets' publish step.
