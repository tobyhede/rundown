name: Plugin Smoke Test

on:
  push:
    paths:
      - 'packages/claude-code-plugin/**'
      - '.github/workflows/plugin-smoke-test.yml'
  pull_request:
    paths:
      - 'packages/claude-code-plugin/**'
      - '.github/workflows/plugin-smoke-test.yml'

jobs:
  smoke-test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run smoke tests
        run: npm run test:smoke
        working-directory: packages/claude-code-plugin

      - name: Run unit tests
        run: npm test
        working-directory: packages/claude-code-plugin

  smoke-test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run smoke tests
        run: npm run test:smoke
        working-directory: packages/claude-code-plugin

  performance-test:
    runs-on: ubuntu-latest
    needs: smoke-test-linux
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run performance tests
        run: npm run test:perf
        working-directory: packages/claude-code-plugin
        env:
          CI: true

  coverage:
    runs-on: ubuntu-latest
    needs: smoke-test-linux
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests with coverage
        run: npm run test:coverage
        working-directory: packages/claude-code-plugin

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2  # v5
        with:
          files: ./packages/claude-code-plugin/coverage/lcov.info
          flags: claude-code-plugin
          fail_ci_if_error: false
