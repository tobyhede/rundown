name: Plugin Smoke Test

on:
  push:
    paths:
      - 'packages/claude-code-plugin/**'
      - '.github/workflows/plugin-smoke-test.yml'
  pull_request:
    paths:
      - 'packages/claude-code-plugin/**'
      - '.github/workflows/plugin-smoke-test.yml'

jobs:
  smoke-test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run smoke tests
        run: npm run test:smoke
        working-directory: packages/claude-code-plugin

      - name: Run unit tests
        run: npm test
        working-directory: packages/claude-code-plugin

  smoke-test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run smoke tests
        run: npm run test:smoke
        working-directory: packages/claude-code-plugin

  performance-test:
    runs-on: ubuntu-latest
    needs: smoke-test-linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run performance tests
        run: npm run test:perf
        working-directory: packages/claude-code-plugin
        env:
          CI: true

  coverage:
    runs-on: ubuntu-latest
    needs: smoke-test-linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests with coverage
        run: npm run test:coverage
        working-directory: packages/claude-code-plugin

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./packages/claude-code-plugin/coverage/lcov.info
          flags: claude-code-plugin
          fail_ci_if_error: false
