name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-deps
        with:
          node-version: 24

      - name: Format check
        run: npm run check:format

      - name: Spell check
        run: npm run check:spell

      - name: Fast lint (Biome)
        run: npm run check:lint:fast

      - name: Check xstate doc version banner
        run: npm run check:docs:xstate-version

  complexity-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-deps
        with:
          node-version: 24

      - name: Complexity checks
        run: npm run check:complexity

  setup-build-node24:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-deps
        with:
          node-version: 24

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: build-artifacts-node24
          path: |
            packages/parser/dist/
            packages/core/dist/
            packages/cli/dist/
            packages/claude-code-plugin/dist/
            packages/mcp/dist/
          retention-days: 1

  setup-build-node25:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-deps
        with:
          node-version: 25

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: build-artifacts-node25
          path: |
            packages/parser/dist/
            packages/core/dist/
            packages/cli/dist/
            packages/claude-code-plugin/dist/
            packages/mcp/dist/
          retention-days: 1

  lint-typed:
    runs-on: ubuntu-latest
    needs: setup-build-node24
    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-deps
        with:
          node-version: 24

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: build-artifacts-node24
          path: packages

      - name: Type-checked lint (ESLint)
        run: npm run check:lint:typed

      - name: Type check (parser)
        run: npm run check:types:parser

      - name: Type check (core)
        run: npm run check:types:core

      - name: Type check (cli)
        run: npm run check:types:cli

  coverage-parser:
    runs-on: ubuntu-latest
    needs: setup-build-node24
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-deps
        with:
          node-version: 24

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: build-artifacts-node24
          path: packages

      - name: Test parser with coverage
        run: npm run test:coverage:parser

      - name: Upload parser coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: coverage-parser
          path: packages/parser/coverage/lcov.info
          retention-days: 1

  coverage-core:
    runs-on: ubuntu-latest
    needs: setup-build-node24
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-deps
        with:
          node-version: 24

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: build-artifacts-node24
          path: packages

      - name: Test core with coverage
        run: npm run test:coverage:core

      - name: Upload core coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: coverage-core
          path: packages/core/coverage/lcov.info
          retention-days: 1

  coverage-cli:
    runs-on: ubuntu-latest
    needs: setup-build-node24
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-deps
        with:
          node-version: 24

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: build-artifacts-node24
          path: packages

      - name: Test CLI with coverage
        run: npm run test:coverage:cli

      - name: Upload CLI coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: coverage-cli
          path: packages/cli/coverage/lcov.info
          retention-days: 1

  coverage-plugin:
    runs-on: ubuntu-latest
    needs: setup-build-node24
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-deps
        with:
          node-version: 24

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: build-artifacts-node24
          path: packages

      - name: Test plugin with coverage
        run: npm run test:coverage:plugin

      - name: Upload plugin coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: coverage-plugin
          path: packages/claude-code-plugin/coverage/lcov.info
          retention-days: 1

  coverage-mcp:
    runs-on: ubuntu-latest
    needs: setup-build-node24
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-deps
        with:
          node-version: 24

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: build-artifacts-node24
          path: packages

      - name: Test MCP with coverage
        run: npm run test:coverage:mcp

      - name: Upload MCP coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: coverage-mcp
          path: packages/mcp/coverage/lcov.info
          retention-days: 1

  upload-coverage:
    runs-on: ubuntu-latest
    needs:
      - coverage-parser
      - coverage-core
      - coverage-cli
      - coverage-plugin
      - coverage-mcp
    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - name: Download coverage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: coverage-*
          path: coverage-artifacts

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2  # v5
        with:
          files: ./coverage-artifacts/coverage-parser/lcov.info,./coverage-artifacts/coverage-core/lcov.info,./coverage-artifacts/coverage-cli/lcov.info,./coverage-artifacts/coverage-plugin/lcov.info,./coverage-artifacts/coverage-mcp/lcov.info
          fail_ci_if_error: false

  node25-smoke:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: setup-build-node25
    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-deps
        with:
          node-version: 25

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: build-artifacts-node25
          path: packages

      - name: Test Node 25 smoke
        run: npm test

  perf:
    runs-on: ubuntu-latest
    needs: setup-build-node24
    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-deps
        with:
          node-version: 24

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: build-artifacts-node24
          path: packages

      - name: Run performance tests
        run: npm run test:perf

  scenarios:
    runs-on: ubuntu-latest
    needs: setup-build-node24
    permissions:
      actions: read
      contents: read
    env:
      RUNDOWN_SCENARIO_IN_PROCESS: '1'

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-deps
        with:
          node-version: 24

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: build-artifacts-node24
          path: packages

      - name: Run frontmatter scenarios
        run: npm run test:scenarios:raw

      - name: Run scenario suites
        run: npm run test:scenario-suites:raw

  playwright:
    runs-on: ubuntu-latest
    needs: setup-build-node24
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-deps
        with:
          node-version: 24

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: build-artifacts-node24
          path: packages

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Build WebContainer snapshot
        run: npm run build:snapshot -w site

      - name: Run Playwright tests
        run: npm test -w site

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: failure()
        with:
          name: playwright-report
          path: site/playwright-report/
          retention-days: 30
