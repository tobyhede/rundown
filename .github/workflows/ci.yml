name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-deps
        with:
          node-version: 24

      - name: Format check
        run: pnpm run check:format

      - name: Spell check
        run: pnpm run check:spell

      - name: Fast lint (Biome)
        run: pnpm run check:lint:fast

      - name: Check xstate doc version banner
        run: pnpm run check:docs:xstate-version

  complexity-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-deps
        with:
          node-version: 24

      - name: Complexity checks
        run: pnpm run check:complexity

  setup-build-node24:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-deps
        with:
          node-version: 24

      - name: Build
        run: pnpm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: build-artifacts-node24
          path: |
            packages/parser/dist/
            packages/core/dist/
            packages/cli/dist/
            packages/claude-code-plugin/dist/
            packages/mcp/dist/
          retention-days: 1

  setup-build-node25:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-deps
        with:
          node-version: 25

      - name: Build
        run: pnpm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: build-artifacts-node25
          path: |
            packages/parser/dist/
            packages/core/dist/
            packages/cli/dist/
            packages/claude-code-plugin/dist/
            packages/mcp/dist/
          retention-days: 1

  lint-typed:
    runs-on: ubuntu-latest
    needs: setup-build-node24
    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-deps
        with:
          node-version: 24

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: build-artifacts-node24
          path: packages

      - name: Type-checked lint (ESLint)
        run: pnpm run check:lint:typed

      - name: Type check (parser)
        run: pnpm run check:types:parser

      - name: Type check (core)
        run: pnpm run check:types:core

      - name: Type check (cli)
        run: pnpm run check:types:cli

  coverage-parser:
    runs-on: ubuntu-latest
    needs: setup-build-node24
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-deps
        with:
          node-version: 24

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: build-artifacts-node24
          path: packages

      - name: Test parser with coverage
        run: pnpm run test:coverage:parser

      - name: Upload parser coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: coverage-parser
          path: packages/parser/coverage/lcov.info
          retention-days: 1

  coverage-core:
    runs-on: ubuntu-latest
    needs: setup-build-node24
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-deps
        with:
          node-version: 24

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: build-artifacts-node24
          path: packages

      - name: Test core with coverage
        run: pnpm run test:coverage:core

      - name: Upload core coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: coverage-core
          path: packages/core/coverage/lcov.info
          retention-days: 1

  coverage-cli:
    runs-on: ubuntu-latest
    needs: setup-build-node24
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-deps
        with:
          node-version: 24

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: build-artifacts-node24
          path: packages

      - name: Test CLI with coverage
        run: pnpm run test:coverage:cli

      - name: Upload CLI coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: coverage-cli
          path: packages/cli/coverage/lcov.info
          retention-days: 1

  coverage-plugin:
    runs-on: ubuntu-latest
    needs: setup-build-node24
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-deps
        with:
          node-version: 24

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: build-artifacts-node24
          path: packages

      - name: Test plugin with coverage
        run: pnpm run test:coverage:plugin

      - name: Upload plugin coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: coverage-plugin
          path: packages/claude-code-plugin/coverage/lcov.info
          retention-days: 1

  coverage-mcp:
    runs-on: ubuntu-latest
    needs: setup-build-node24
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-deps
        with:
          node-version: 24

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: build-artifacts-node24
          path: packages

      - name: Test MCP with coverage
        run: pnpm run test:coverage:mcp

      - name: Upload MCP coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: coverage-mcp
          path: packages/mcp/coverage/lcov.info
          retention-days: 1

  upload-coverage:
    runs-on: ubuntu-latest
    needs:
      - coverage-parser
      - coverage-core
      - coverage-cli
      - coverage-plugin
      - coverage-mcp
    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Download coverage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: coverage-*
          path: coverage-artifacts

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v5
        with:
          files: ./coverage-artifacts/coverage-parser/lcov.info,./coverage-artifacts/coverage-core/lcov.info,./coverage-artifacts/coverage-cli/lcov.info,./coverage-artifacts/coverage-plugin/lcov.info,./coverage-artifacts/coverage-mcp/lcov.info
          fail_ci_if_error: false

  node25-smoke:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: setup-build-node25
    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-deps
        with:
          node-version: 25

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: build-artifacts-node25
          path: packages

      - name: Test Node 25 smoke
        run: pnpm test

  perf:
    runs-on: ubuntu-latest
    needs: setup-build-node24
    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-deps
        with:
          node-version: 24

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: build-artifacts-node24
          path: packages

      - name: Run performance tests
        run: pnpm run test:perf

  scenarios:
    runs-on: ubuntu-latest
    needs: setup-build-node24
    permissions:
      actions: read
      contents: read
    env:
      RUNDOWN_SCENARIO_IN_PROCESS: '1'

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-deps
        with:
          node-version: 24

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: build-artifacts-node24
          path: packages

      - name: Run script harness tests
        run: pnpm run test:unit:scripts

      - name: Run frontmatter scenarios
        run: pnpm run test:scenarios:raw

      - name: Run scenario suites
        run: pnpm run test:scenario-suites:raw

  # Per-PR Stryker dry run: validates the mutation-testing wiring (plugin
  # resolution, packageManager, jest runner) under pnpm's isolated layout
  # without paying for a full mutation run. The per-PR changed-file gate
  # (.github/workflows/mutation-pr.yml) runs the real mutants for affected
  # packages and enforces the per-file floor; the scheduled mutation.yml still
  # runs the full suite weekly with the package-level `break` threshold.
  stryker-dry:
    runs-on: ubuntu-latest
    needs: setup-build-node24
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-deps
        with:
          node-version: 24

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: build-artifacts-node24
          path: packages

      - name: Stryker dry run (CLI)
        run: pnpm run test:mutate:cli:dry

  rd-landlock-build:
    runs-on: ubuntu-latest
    # Minimal scope: uploading an artifact needs only the default token, not
    # `actions: write` (that is for the Actions management API, not artifacts).
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-deps
        with:
          node-version: 24

      # rust-toolchain.toml in native/rd-landlock pins the channel + musl targets;
      # rustup honours it automatically when run in that directory.
      - name: Install pinned Rust toolchain
        working-directory: native/rd-landlock
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl

      - name: Install Zig + cargo-zigbuild (real musl cross-linker)
        run: |
          set -euo pipefail
          pipx install ziglang==0.13.0 || pip install --user ziglang==0.13.0
          cargo install --locked cargo-zigbuild@0.19.8

      - name: Build binaries + provenance manifest
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/build-native.mjs

      - name: Assert static ELF of the expected arch
        env:
          RD_ASSERT_NATIVE_RUN: '1'
        run: node scripts/assert-native.mjs

      - name: Upload rd-landlock binaries + manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: rd-landlock-binaries
          path: packages/core/dist/native/
          retention-days: 1

  landlock-integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-deps
        with:
          node-version: 24

      - name: Install landrun (Landlock wrapper)
        env:
          LANDRUN_VERSION: v0.1.14
          # sha256 of landrun-linux-amd64 for the pinned version
          LANDRUN_SHA256: 645178e3239cd33760560834e50efea0864183a2a8a82faf199760dffee6dd71
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/landrun \
            "https://github.com/Zouuup/landrun/releases/download/${LANDRUN_VERSION}/landrun-linux-amd64"
          echo "${LANDRUN_SHA256}  /tmp/landrun" | sha256sum -c -
          sudo install -m 0755 /tmp/landrun /usr/local/bin/landrun
          rm -f /tmp/landrun
          landrun --help >/dev/null && echo "landrun installed: $(command -v landrun)"

      - name: Report Landlock environment
        run: |
          uname -r
          cat /sys/kernel/security/lsm 2>/dev/null \
            || echo "securityfs lsm not readable — functional probe fallback will be used"

      # RUNDOWN_REQUIRE_LANDLOCK=1 turns a missing/non-enforcing sandbox into a
      # hard failure, so this job genuinely exercises real Landlock enforcement
      # rather than silently skipping the way local/dev runs do.
      - name: Run Landlock enforcement integration test
        env:
          RUNDOWN_REQUIRE_LANDLOCK: '1'
        run: pnpm --filter @rundown-org/core test -- --testPathPatterns 'enforcement\.integration\.test\.ts$'

  playwright:
    runs-on: ubuntu-latest
    needs: setup-build-node24
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-deps
        with:
          node-version: 24

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: build-artifacts-node24
          path: packages

      - name: Install Playwright Chromium
        run: pnpm --filter site exec playwright install chromium --with-deps

      - name: Build WebContainer snapshot
        run: pnpm --filter site build:snapshot

      - name: Run Playwright tests
        run: pnpm --filter site test

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: failure()
        with:
          name: playwright-report
          path: site/playwright-report/
          retention-days: 30
