  iterate-and-delegate-for-each:
    description: "FOR + DELEGATE reserves one child per item; each is claimed, passed and collected in turn — completes"
    file: runbooks/patterns/iterate-and-delegate.runbook.md
    commands:
      - rd run --allow-all iterate-and-delegate.runbook.md
      # 2. FOR item IN Items + DELEGATE: each iteration's entry issues a fresh ticket
      - rd claim ${TICKET} --agent-id worker-left
      - rd pass --token ${CHILD_TOKEN} --step 1
      - rd collect --token ${TOKEN}
      - rd claim ${TICKET_2} --agent-id worker-right
      - rd pass --token ${CHILD_TOKEN_2} --step 1
      - rd collect --token ${TOKEN}
    expect:
      result: COMPLETE
      collected:
        - index: 1
          status: collected
          result: pass
        - index: 2
          status: collected
          result: pass

  convert-skill-check-loop:
    description: "The non-delegating control: check fails once, GOTO 4 rewrites, and the checklist completes"
    file: scenarios/convert-skill-harness.runbook.md
    commands:
      - rd run --prompted convert-skill-harness.runbook.md
      - rd pass --token ${TOKEN} --step 1   # harness: SkillPath named; convert-skill launches inline
      - rd pass --token ${TOKEN} --step 1
      - rd pass --token ${TOKEN} --step 2
      - rd pass --token ${TOKEN} --step 3
      - rd pass --token ${TOKEN} --step 4
      - rd fail --token ${TOKEN} --step 5   # 5. Check the runbook fails → GOTO 4
