version: 1
name: plugin-runbooks
description: Structural coverage for plugin runbooks

cases:
  # --- write-plan: happy path ---

  write-plan-all-pass:
    description: All steps pass through to completion
    file: runbooks/planning/write-plan.runbook.md
    commands:
      - rd run --prompted write-plan.runbook.md
      - rd pass   # 1. Review schema
      - rd pass   # 2. Check scope
      - rd pass   # 3. Gather requirements
      - rd pass   # 4. Research codebase
      - rd pass   # 5. Map file structure
      - rd pass   # 6. Output path
      - rd pass   # 7. Write the plan
      - rd pass   # 8. Check schema
      - rd pass   # 9. Verify plan structure
      - rd pass   # 10. Feedback
    result: COMPLETE

  write-plan-feedback-fail-still-completes:
    description: FAIL at feedback still completes (non-blocking)
    file: runbooks/planning/write-plan.runbook.md
    commands:
      - rd run --prompted write-plan.runbook.md
      - rd pass   # 1. Review schema
      - rd pass   # 2. Check scope
      - rd pass   # 3. Gather requirements
      - rd pass   # 4. Research codebase
      - rd pass   # 5. Map file structure
      - rd pass   # 6. Output path
      - rd pass   # 7. Write the plan
      - rd pass   # 8. Check schema
      - rd pass   # 9. Verify plan structure
      - rd fail   # 10. Feedback → COMPLETE (non-blocking)
    result: COMPLETE

  # --- write-plan: early termination ---

  write-plan-fail-at-schema:
    description: FAIL at schema review stops the runbook
    file: runbooks/planning/write-plan.runbook.md
    commands:
      - rd run --prompted write-plan.runbook.md
      - rd fail   # 1. Review schema → STOP
    result: STOP

  write-plan-fail-at-scope:
    description: FAIL at scope check stops the runbook
    file: runbooks/planning/write-plan.runbook.md
    commands:
      - rd run --prompted write-plan.runbook.md
      - rd pass   # 1. Review schema
      - rd fail   # 2. Check scope → STOP
    result: STOP

  write-plan-fail-at-requirements:
    description: FAIL at requirements stops the runbook
    file: runbooks/planning/write-plan.runbook.md
    commands:
      - rd run --prompted write-plan.runbook.md
      - rd pass   # 1. Review schema
      - rd pass   # 2. Check scope
      - rd fail   # 3. Gather requirements → STOP
    result: STOP

  write-plan-fail-at-research:
    description: FAIL at research stops the runbook
    file: runbooks/planning/write-plan.runbook.md
    commands:
      - rd run --prompted write-plan.runbook.md
      - rd pass   # 1. Review schema
      - rd pass   # 2. Check scope
      - rd pass   # 3. Gather requirements
      - rd fail   # 4. Research codebase → STOP
    result: STOP

  write-plan-fail-at-file-structure:
    description: FAIL at file structure mapping stops the runbook
    file: runbooks/planning/write-plan.runbook.md
    commands:
      - rd run --prompted write-plan.runbook.md
      - rd pass   # 1. Review schema
      - rd pass   # 2. Check scope
      - rd pass   # 3. Gather requirements
      - rd pass   # 4. Research codebase
      - rd fail   # 5. Map file structure → STOP
    result: STOP

  write-plan-fail-at-output-path:
    description: FAIL at output path resolution stops the runbook
    file: runbooks/planning/write-plan.runbook.md
    commands:
      - rd run --prompted write-plan.runbook.md
      - rd pass   # 1. Review schema
      - rd pass   # 2. Check scope
      - rd pass   # 3. Gather requirements
      - rd pass   # 4. Research codebase
      - rd pass   # 5. Map file structure
      - rd fail   # 6. Output path → STOP
    result: STOP

  write-plan-fail-at-write:
    description: FAIL at plan writing stops the runbook
    file: runbooks/planning/write-plan.runbook.md
    commands:
      - rd run --prompted write-plan.runbook.md
      - rd pass   # 1. Review schema
      - rd pass   # 2. Check scope
      - rd pass   # 3. Gather requirements
      - rd pass   # 4. Research codebase
      - rd pass   # 5. Map file structure
      - rd pass   # 6. Output path
      - rd fail   # 7. Write the plan → STOP
    result: STOP

  # --- write-plan: validation retry loop ---

  write-plan-schema-retry:
    description: Failed schema check loops back to write, then succeeds
    file: runbooks/planning/write-plan.runbook.md
    commands:
      - rd run --prompted write-plan.runbook.md
      - rd pass   # 1. Review schema
      - rd pass   # 2. Check scope
      - rd pass   # 3. Gather requirements
      - rd pass   # 4. Research codebase
      - rd pass   # 5. Map file structure
      - rd pass   # 6. Output path
      - rd pass   # 7. Write the plan
      - rd fail   # 8. Check schema → GOTO 7
      - rd pass   # 7. Write the plan (retry)
      - rd pass   # 8. Check schema
      - rd pass   # 9. Verify plan structure
      - rd pass   # 10. Feedback
    result: COMPLETE

  write-plan-verify-retry:
    description: Failed verification loops back to write, then succeeds
    file: runbooks/planning/write-plan.runbook.md
    commands:
      - rd run --prompted write-plan.runbook.md
      - rd pass   # 1. Review schema
      - rd pass   # 2. Check scope
      - rd pass   # 3. Gather requirements
      - rd pass   # 4. Research codebase
      - rd pass   # 5. Map file structure
      - rd pass   # 6. Output path
      - rd pass   # 7. Write the plan
      - rd pass   # 8. Check schema
      - rd fail   # 9. Verify plan structure → GOTO 7
      - rd pass   # 7. Write the plan (retry)
      - rd pass   # 8. Check schema (retry)
      - rd pass   # 9. Verify plan structure
      - rd pass   # 10. Feedback
    result: COMPLETE
