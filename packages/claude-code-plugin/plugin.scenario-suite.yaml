  end-to-end-review-and-collate:
    description: "end-to-end-test composes review-and-collate inline; its review and collate Delegations are claimed and collected by the root token — completes"
    file: runbooks/end-to-end-test/end-to-end-test.runbook.md
    commands:
      - rd run --prompted end-to-end-test.runbook.md
      - rd pass --token ${TOKEN} --step 1   # 1. Read the output schema; write-file launches inline
      - rd pass --token ${TOKEN} --step 1   # write-file 1-3 on the root token
      - rd pass --token ${TOKEN} --step 2
      - rd pass --token ${TOKEN} --step 3   # write-file completes; review-and-collate launches inline
      - rd claim ${TICKET} --agent-id reviewer
      - rd pass --token ${CHILD_TOKEN} --step 1
      - rd pass --token ${CHILD_TOKEN} --step 2
      - rd pass --token ${CHILD_TOKEN} --step 3
      - rd pass --token ${CHILD_TOKEN} --step 4
