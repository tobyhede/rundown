      - rd pass --token ${CHILD_TOKEN_2} --step 6
      - rd pass --token ${CHILD_TOKEN_3} --step 1
      - rd pass --token ${CHILD_TOKEN_3} --step 2
      - rd pass --token ${CHILD_TOKEN_3} --step 3
      - rd pass --token ${CHILD_TOKEN_3} --step 4
      - rd pass --token ${CHILD_TOKEN_3} --step 5
      - rd pass --token ${CHILD_TOKEN_3} --step 6
      - rd pass --token ${CHILD_TOKEN_4} --step 1
      - rd pass --token ${CHILD_TOKEN_4} --step 2
      - rd pass --token ${CHILD_TOKEN_4} --step 3
      - rd pass --token ${CHILD_TOKEN_4} --step 4
