      - rd pass --token ${CHILD_TOKEN_5} --step 1
      - rd pass --token ${CHILD_TOKEN_5} --step 2
      - rd pass --token ${CHILD_TOKEN_5} --step 3
      - rd pass --token ${CHILD_TOKEN_5} --step 4
      - rd pass --token ${CHILD_TOKEN_5} --step 5
      - rd pass --token ${CHILD_TOKEN_5} --step 6
      - rd collect --token ${TOKEN}
    expect:
      result: COMPLETE
      collected:
        - step: '3.1'
          status: collected
          result: pass
        - step: '3.2'
          status: collected
          result: pass
        - step: '3.3'
          status: collected
