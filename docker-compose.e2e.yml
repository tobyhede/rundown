# docker-compose.e2e.yml — Rundown E2E test harness
# Usage:
#   docker compose -f docker-compose.e2e.yml build e2e
#   docker compose -f docker-compose.e2e.yml run --rm e2e

services:
  e2e:
    build:
      context: .
      dockerfile: scripts/Dockerfile.verify
      target: e2e
    image: rundown-e2e:latest
    # Allow the Landlock sandbox to actually engage inside the container:
    #   seccomp=unconfined    — permit the landlock_* syscalls (the load-bearing
    #                           one; Rundown probes them functionally via the
    #                           rd-landlock functional probe)
    #   systempaths=unconfined — unmask /sys/kernel/security so diagnostic reads
    #                           of the lsm list succeed. Enforcement detection
    #                           does NOT rely on this: Rundown determines Landlock
    #                           availability via the functional rd-landlock probe
    #                           (authoritative; see docs/reference/security.md
    #                           §16.1), not a securityfs fast-path.
    security_opt:
      - seccomp=unconfined
      - systempaths=unconfined
    volumes:
      - ./.claude-docker:/home/testuser/.claude
      - ./.codex-docker:/home/testuser/.codex
      - ./logs:/home/testuser/logs
    environment:
      - CLAUDE_CONFIG_DIR=/home/testuser/.claude
      - CODEX_HOME=/home/testuser/.codex
      - RUNDOWN_LOG=1
      - RUNDOWN_LOG_LEVEL=debug
    stdin_open: true
    tty: true
